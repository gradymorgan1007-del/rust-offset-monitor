
name: Rust Offset Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  check-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Restore previous Rust version
        uses: actions/cache/restore@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
          restore-keys: |
            rust-state-

      - name: Check Rust offsets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          api = "https://offsets.yxllow.dev/api/rust/latest"

          req = urllib.request.Request(
              api,
              headers={"User-Agent": "RustOffsetMonitor"}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
          except Exception as e:
              raise RuntimeError(f"Could not fetch Rust offsets: {e}")

          if not isinstance(data, dict):
              raise RuntimeError("Unexpected API response format")

          files = data.get("files") or {}
          offsets = files.get("offsets") or {}
          steam = data.get("steam") or {}

          current = {
              "offsets_sha256": offsets.get("sha256"),
              "status": data.get("status"),
              "steam_buildid": steam.get("buildid")
          }

          if not current["offsets_sha256"]:
              print("API response:", json.dumps(data, indent=2))
              raise RuntimeError("Rust offsets hash not found in API response")

          if not os.environ.get("DISCORD_WEBHOOK"):
              raise RuntimeError(
                  "DISCORD_WEBHOOK secret is missing from GitHub settings"
              )

          path = "rust-state.json"
          previous = None

          if os.path.exists(path):
              try:
                  with open(path, "r") as f:
                      previous = json.load(f)
              except (json.JSONDecodeError, OSError):
                  previous = None

          if previous is None:
              print("First run: saving baseline. No alert sent.")
          elif current != previous:
              changes = []

              labels = [
                  ("offsets_sha256", "Rust offsets hash"),
                  ("status", "Offset status"),
                  ("steam_buildid", "Steam build ID")
              ]

              for key, label in labels:
                  if current.get(key) != previous.get(key):
                      changes.append(
                          f"**{label}:** "
                          f"`{previous.get(key)}` → `{current.get(key)}`"
                      )

              message = (
                  "🚨 **Rust offsets update detected!**\n"
                  + "\n".join(changes)
                  + "\nhttps://offsets.yxllow.dev/"
              )

              payload = json.dumps({
                  "content": message
              }).encode("utf-8")

              discord_req = urllib.request.Request(
                  os.environ["DISCORD_WEBHOOK"],
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      discord_req, timeout=30
                  ) as response:
                      print("Discord response:", response.status)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(
                      f"Discord webhook returned HTTP {e.code}"
                  )

              print("Discord update notification sent.")
          else:
              print("No changes detected.")

          with open(path, "w") as f:
              json.dump(current, f)

          print("Current Rust state saved.")
          PY

      - name: Save current Rust version
        uses: actions/cache/save@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
