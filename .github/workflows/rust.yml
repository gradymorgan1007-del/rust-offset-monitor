
name: Rust Offset Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  check-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous Rust version
        uses: actions/cache/restore@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
          restore-keys: |
            rust-state-

      - name: Check Rust offsets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          api = "https://offsets.yxllow.dev/api/rust/latest"
          req = urllib.request.Request(
              api,
              headers={"User-Agent": "RustOffsetMonitor"}
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)

          if not isinstance(data, dict):
              raise RuntimeError("Unexpected API response")

          current = {
              "build": data.get("build"),
              "status": data.get("status"),
              "steam": data.get("steam")
          }

          if not current["build"]:
              print("API response:", json.dumps(data, indent=2))
              raise RuntimeError("Rust build field not found")

          path = "rust-state.json"
          previous = None

          if os.path.exists(path):
              with open(path) as f:
                  previous = json.load(f)

          if previous is None:
              print("First run: saving baseline, no alert.")
          elif current != previous:
              changes = []

              for key, label in [
                  ("build", "Rust build"),
                  ("status", "Offset status"),
                  ("steam", "Steam build")
              ]:
                  if current[key] != previous.get(key):
                      changes.append(
                          f"**{label}:** "
                          f"`{previous.get(key)}` → `{current[key]}`"
                      )

              message = (
                  "🚨 **Rust offsets changed!**\n"
                  + "\n".join(changes)
                  + "\nhttps://offsets.yxllow.dev/"
              )

              payload = json.dumps({
                  "content": message
              }).encode()

              request = urllib.request.Request(
                  os.environ["DISCORD_WEBHOOK"],
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=20) as r:
                  print("Discord response:", r.status)

              print("Update notification sent.")
          else:
              print("No changes detected.")

          with open(path, "w") as f:
              json.dump(current, f)
          PY

      - name: Save current Rust version
        uses: actions/cache/save@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
