
name: Rust Offset Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  check-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Restore previous Rust version
        uses: actions/cache/restore@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
          restore-keys: |
            rust-state-

      - name: Check Rust offsets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          def get_value(obj, key):
              if isinstance(obj, dict):
                  return obj.get(key)

              if isinstance(obj, list):
                  for item in obj:
                      if isinstance(item, dict):
                          if key in item:
                              return item[key]

                          name = (
                              item.get("name")
                              or item.get("key")
                              or item.get("filename")
                          )

                          if name == key:
                              return item

              return None

          api = "https://offsets.yxllow.dev/api/rust/latest"
          req = urllib.request.Request(
              api,
              headers={"User-Agent": "RustOffsetMonitor"}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
          except Exception as e:
              raise RuntimeError(f"Could not fetch website data: {e}")

          if not isinstance(data, (dict, list)):
              raise RuntimeError("Unexpected website response")

          files = get_value(data, "files")
          offsets = get_value(files, "offsets")
          steam = get_value(data, "steam")

          offset_hash = get_value(offsets, "sha256")
          steam_build = get_value(steam, "buildid")
          status = get_value(data, "status")

          if not offset_hash:
              print("Website response:")
              print(json.dumps(data, indent=2))
              raise RuntimeError(
                  "Could not find the offsets SHA-256 hash. "
                  "The website response format may have changed."
              )

          current = {
              "offsets_sha256": offset_hash,
              "status": status,
              "steam_buildid": steam_build
          }

          if not os.environ.get("DISCORD_WEBHOOK"):
              raise RuntimeError(
                  "Missing DISCORD_WEBHOOK secret in GitHub settings."
              )

          path = "rust-state.json"
          previous = None

          if os.path.exists(path):
              try:
                  with open(path, "r") as f:
                      previous = json.load(f)
              except (json.JSONDecodeError, OSError):
                  previous = None

          if previous is None:
              print("First run: saving baseline. No alert sent.")

          elif current != previous:
              labels = [
                  ("offsets_sha256", "Rust offsets hash"),
                  ("status", "Offset status"),
                  ("steam_buildid", "Steam build ID")
              ]

              changes = []

              for key, label in labels:
                  if current.get(key) != previous.get(key):
                      changes.append(
                          f"**{label}:** "
                          f"`{previous.get(key)}` -> `{current.get(key)}`"
                      )

              if changes:
                  message = (
                      "Rust offsets update detected!\n"
                      + "\n".join(changes)
                      + "\nhttps://offsets.yxllow.dev/"
                  )

                  payload = json.dumps({
                      "content": message
                  }).encode("utf-8")

                  discord_req = urllib.request.Request(
                      os.environ["DISCORD_WEBHOOK"],
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          discord_req, timeout=30
                      ) as response:
                          print("Discord response:", response.status)
                  except urllib.error.HTTPError as e:
                      raise RuntimeError(
                          f"Discord webhook failed with HTTP {e.code}"
                      )

                  print("Discord notification sent.")
          else:
              print("No changes detected.")

          with open(path, "w") as f:
              json.dump(current, f)

          print("Current state saved.")
          PY

      - name: Save current Rust version
        uses: actions/cache/save@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
