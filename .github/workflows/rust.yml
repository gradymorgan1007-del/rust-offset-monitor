
name: Rust Offset Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

jobs:
  check-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
          restore-keys: |
            rust-state-

      - name: Check Rust offsets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          API = "https://offsets.yxllow.dev/api/rust/latest"
          STATE_FILE = "rust-state.json"

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)

          def get_current(data):
              offset_hash = None
              status = None
              steam_build = None

              for item in walk(data):
                  files = item.get("files")
                  if isinstance(files, dict):
                      offsets = files.get("offsets")
                      if isinstance(offsets, dict):
                          value = offsets.get("sha256")
                          if value:
                              offset_hash = value

                  if status is None and isinstance(item.get("status"), str):
                      status = item["status"]

                  steam = item.get("steam")
                  if isinstance(steam, dict) and steam.get("buildid"):
                      steam_build = steam["buildid"]

              if not offset_hash:
                  print("Could not locate the offsets hash.")
                  print(json.dumps(data, indent=2)[:12000])
                  raise RuntimeError(
                      "Website response structure was not recognized."
                  )

              return {
                  "offsets_sha256": offset_hash,
                  "status": status,
                  "steam_buildid": steam_build
              }

          request = urllib.request.Request(
              API,
              headers={"User-Agent": "RustOffsetMonitor"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
          except Exception as error:
              raise RuntimeError(f"Could not fetch website data: {error}")

          current = get_current(data)
          print("Successfully read the current offsets information.")

          previous = None
          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE, "r") as file:
                      previous = json.load(file)
              except (OSError, json.JSONDecodeError):
                  print("Previous state was unreadable; creating a new baseline.")

          if previous is None:
              print("First run: saving baseline. No alert sent.")

          elif current != previous:
              labels = {
                  "offsets_sha256": "Rust offsets file changed",
                  "status": "Offset status changed",
                  "steam_buildid": "Steam build ID changed"
              }

              changes = []
              for key, label in labels.items():
                  if current.get(key) != previous.get(key):
                      changes.append(
                          f"**{label}:** `{previous.get(key)}` -> "
                          f"`{current.get(key)}`"
                      )

              if changes:
                  webhook = os.environ.get("DISCORD_WEBHOOK")
                  if not webhook:
                      raise RuntimeError(
                          "Add your Discord webhook under Settings > Secrets "
                          "and variables > Actions as DISCORD_WEBHOOK."
                      )

                  message = (
                      "Rust offsets update detected!\n"
                      + "\n".join(changes)
                      + "\nhttps://offsets.yxllow.dev/"
                  )

                  payload = json.dumps({
                      "content": message
                  }).encode("utf-8")

                  discord_request = urllib.request.Request(
                      webhook,
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          discord_request, timeout=30
                      ) as response:
                          print(f"Discord notification sent: HTTP {response.status}")
                  except urllib.error.HTTPError as error:
                      raise RuntimeError(
                          f"Discord webhook returned HTTP {error.code}"
                      )

          else:
              print("No changes detected.")

          with open(STATE_FILE, "w") as file:
              json.dump(current, file)

          print("Current state saved.")
          PY

      - name: Save current state
        uses: actions/cache/save@v4
        with:
          path: rust-state.json
          key: rust-state-${{ github.run_id }}
